name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run gradle tasks
        run: ./gradlew :utils:ktfmtCheck :measurement:ktfmtCheck :utils:detektMain :measurement:detektMain :utils:test :measurement:test

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
#      - run: yes | sdkmanager --licenses
#      - run: sdkmanager --install "platforms;android-37" "platform-tools"
      - name: Run gradle tasks
        run: ./gradlew :app:ktfmtCheck :app:detektMain :app:testDebugUnitTest
